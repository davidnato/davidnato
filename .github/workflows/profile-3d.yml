name: Generate 3D contribution skyline

on:
  workflow_dispatch:
  schedule:
    # 05:17 East Africa Time (UTC+3), daily.
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: profile-3d-contribution-generation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate green 3D contribution skylines
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit refreshed SVG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 3D contribution skyline"
            git push
          else
            echo "3D contribution skyline is already current."
          fi
